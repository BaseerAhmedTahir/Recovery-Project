[workspace]
resolver = "2"
members = [
    "crates/rc-device",
    "crates/rc-image",
    "crates/rc-partition",
    "crates/rc-fs",
    "crates/rc-carve",
    "crates/rc-bifrag",
    "crates/rc-index",
    "crates/rc-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "local-only"

[workspace.dependencies]
# --- error handling / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- hashing ---
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- cli ---
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# --- platform ---
libc = "0.2"

# --- parallelism ---
rayon = "1"

# --- storage ---
# `bundled` compiles SQLite's amalgamation rather than linking a system copy,
# so a recovery run cannot depend on what happens to be installed on the
# machine it is run from. SPEC.md section 2 names this crate specifically.
rusqlite = { version = "0.32", features = ["bundled"] }

# --- internal ---
rc-device = { path = "crates/rc-device" }
rc-image = { path = "crates/rc-image" }
rc-partition = { path = "crates/rc-partition" }
rc-fs = { path = "crates/rc-fs" }
rc-carve = { path = "crates/rc-carve" }
rc-bifrag = { path = "crates/rc-bifrag" }
rc-index = { path = "crates/rc-index" }

# Optimise dependencies even in dev/test builds while leaving our own crates
# unoptimised and debuggable.
#
# This is not a micro-optimisation: the immutability test hashes roughly 4 GiB
# of fixtures twice, and an unoptimised sha2 runs about thirty times slower than
# a compiled one. Without this the test suite takes tens of minutes instead of
# well under one.
[profile.dev.package."*"]
opt-level = 2

# The scanner, for the same reason and by a wider margin.
#
# rc-carve's inner loop runs over every byte of a 512 MiB fixture, several
# times, in three integration tests. Unoptimised that measured 3175 seconds -
# fifty-three minutes for one test binary - against roughly two minutes in
# release. A test suite nobody will sit through is a test suite that stops
# being run, which is the same failure mode as one that silently skips.
#
# rc-index is here because it drives SQLite through hundreds of thousands of
# inserts in the memory test, and rc-image because the immutability test hashes
# gigabytes. Debug assertions stay on for all of them: these parse structures
# off a damaged disk and an overflow check is worth more than a stack frame.
[profile.dev.package.rc-carve]
opt-level = 2

[profile.dev.package.rc-index]
opt-level = 2

[profile.dev.package.rc-image]
opt-level = 2

# Release profile tuned for scanning throughput. Debug assertions stay on in
# dev because on-disk structures we parse are untrusted.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
