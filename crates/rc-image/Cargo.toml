[package]
name = "rc-image"
description = "Forensic imaging: ddrescue-style cloning, hashing, and the only write path in the project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rc-device.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
md-5.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rc-device = { path = "../rc-device", features = ["test-util"] }
