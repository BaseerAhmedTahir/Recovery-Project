[package]
name = "rc-cli"
description = "The RECOVERY-CORE command line. The CLI is the source of truth; the GUI is a thin client over the same library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The companion-app receiver: a socket bound to 127.0.0.1 (SPEC.md 4.4).
bridge = ["rc-mobile/bridge"]

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
rc-device.workspace = true
rc-image.workspace = true
rc-partition.workspace = true
rc-fs.workspace = true
rc-carve.workspace = true
rc-index.workspace = true
rc-session.workspace = true
rc-score.workspace = true
rc-preview.workspace = true
rc-sqlite-carve.workspace = true
rc-mobile.workspace = true
ctrlc = "3"
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rc-device = { path = "../rc-device", features = ["test-util"] }
