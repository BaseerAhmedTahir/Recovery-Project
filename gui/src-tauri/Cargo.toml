[package]
name = "rc-gui"
description = "RECOVERY-CORE desktop GUI: a thin Tauri shell over rc-results and the rc CLI."
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

# Its own workspace: Tauri needs an async runtime (tokio), which the engine's
# offline audit forbids. `cargo xtask audit-gui` audits this tree separately
# and fails if tokio's networking is enabled or any network crate appears.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rc-results = { path = "../../crates/rc-results" }
# The phone's screen over USB, for a broken display. Default features only:
# the loopback bridge is behind its own feature and stays off here.
rc-mobile = { path = "../../crates/rc-mobile", default-features = false }
rc-device = { path = "../../crates/rc-device" }
rc-preview = { path = "../../crates/rc-preview" }
tauri-plugin-dialog = "2.7.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
